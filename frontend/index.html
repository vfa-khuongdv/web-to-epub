<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- Pictures of a comic chapter may be links to the site's own CDN. They are loaded with no referrer
     everywhere (the reader's frame already does), the way the EPUB export asks for them, so a picture
     that loads here also loads in the book. -->
<meta name="referrer" content="no-referrer" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<meta name="theme-color" content="#ececec" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#262626" media="(prefers-color-scheme: dark)" />
<title>Web → EPUB cho Kindle</title>
<script>
  // Đặt theme trước khi trang vẽ, nếu không sẽ chớp nền sáng rồi mới tối.
  // Không lưu gì = theo hệ điều hành.
  (function () {
    try {
      var saved = localStorage.getItem("theme");
      var dark = saved === "dark" || (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    } catch (e) {
      document.documentElement.dataset.theme = "light";
    }
  })();
  // Giao diện ngụy trang (src/skins): đặt skin, tiêu đề tab và favicon trước khi vẽ,
  // để tab không chớp tên thật của app. Giá trị do src/lib/ui/skin.ts ghi.
  (function () {
    try {
      var skin = localStorage.getItem("skin");
      if (skin !== "code" && skin !== "sheet") return;
      document.documentElement.dataset.skin = skin;
      var head = JSON.parse(localStorage.getItem("skin-head") || "null");
      if (!head || typeof head.title !== "string" || typeof head.favicon !== "string") return;
      document.title = head.title;
      var icon = document.querySelector('link[rel="icon"]');
      if (icon) {
        icon.removeAttribute("type");
        icon.setAttribute("href", head.favicon);
      }
    } catch (e) {}
  })();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
