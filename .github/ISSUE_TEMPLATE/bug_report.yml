name: Bug report
description: A crawl failed, extraction is wrong, an export is broken, the UI misbehaves.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If the site is not in the [built-in supported list](https://github.com/vfa-khuongdv/web-to-epub/blob/main/docs/supported-sites.md),
        it is not covered by built-in support — try **Settings → Agent crawler** first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: I added <story URL>, crawled it, and chapter 12 failed with ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the header, or the release tag, or the commit when running from source.
      placeholder: v1.9.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run the app?
      options:
        - macOS app
        - Windows app
        - Linux app
        - Docker
        - Node.js from source
    validations:
      required: true
  - type: input
    id: story-url
    attributes:
      label: Story URL
      placeholder: https://...
    validations:
      required: false
  - type: input
    id: chapter-url
    attributes:
      label: Failing chapter URL
      description: For a single-chapter failure.
    validations:
      required: false
  - type: textarea
    id: error
    attributes:
      label: Error text / log
      render: text
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, whether a site session was imported, which agent engine you use, ...
    validations:
      required: false
